services:
  flametender:
    build: .
    # For TrueNAS/production, swap the line above for the published image
    # instead of building locally:
    # image: ghcr.io/safwyls/flametender:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Only needed for servers WITHOUT a flameagent sidecar — with an agent,
      # Flametender pulls saves and config over its API and neither mount
      # below is used.
      #
      # World saves: bind-mount the server's savegame directory READ-ONLY,
      # then set that container path as the server's "Save path", e.g.:
      # - /path/to/enshrouded/savegame:/saves/myserver:ro
      #
      # Settings editor: separately bind-mount the install folder holding
      # enshrouded_server.json READ-WRITE (no :ro), then set that container
      # path as the server's "Config path". Keeping this a distinct mount
      # from the save directory above is deliberate — the settings editor
      # can write here, while the save data stays read-only, e.g.:
      # - /path/to/enshrouded:/config/myserver
    environment:
      - HTTP_ADDR=:8080
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # No DOCKER_HOST, and no docker socket anywhere in this stack. Every
      # server Flametender raises is a supervisor-mode flameagent — the
      # agent *is* the game process — so power, scheduled restarts, updates
      # and logs all travel over the agent's own API, and every one of
      # those paths tries the agent before it would ever reach docker
      # (internal/api/power.go, internal/sched). Container placement is
      # Ilmari's, which is the only thing on the host holding the socket.
      #
      # The code still accepts DOCKER_HOST for the one shape this console
      # doesn't produce: a game server someone deployed as a plain
      # container with no agent beside it. If you have one of those, add a
      # scoped socket proxy (ghcr.io/tecnativa/docker-socket-proxy with
      # CONTAINERS=1 and POST=1, socket mounted :ro) and point DOCKER_HOST
      # at it — never at the host socket directly, which is
      # root-equivalent.
    restart: unless-stopped
