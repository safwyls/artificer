name: CI

# Verifies the monorepo (web bundles first, since the Go build embeds
# them), the anvil host service, and the dependency rules. All three
# console ports are complete, so no legacy tree is built here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependency rules
        run: ./scripts/checkbounds.sh
      - name: Doc references
        run: ./scripts/checkdocs.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Design systems (token parity, preview freshness)
        run: ./scripts/checkdesign.sh

  monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/flametender/package-lock.json
            web/wildskeeper/package-lock.json
            web/palcon/package-lock.json
            web/reliquary/package-lock.json
            web/companion/package-lock.json
      - name: Flametender frontend build & tests
        working-directory: web/flametender
        run: |
          npm ci
          npm run build
          npm test
      - name: Wildskeeper frontend build & tests
        working-directory: web/wildskeeper
        run: |
          npm ci
          npm run build
          npm test
      - name: Palcon frontend build & tests
        working-directory: web/palcon
        run: |
          npm ci
          npm run build
          npm test
      - name: Reliquary frontend build & tests
        working-directory: web/reliquary
        run: |
          npm ci
          npm run build
          npm test
      - name: Companion frontend build & tests
        working-directory: web/companion
        run: |
          npm ci
          npm run build
          npm test
      - name: Save-extractor dependencies (palsave-backed API tests)
        run: pip install palworld-save-tools==0.24.0 pyooz==0.0.8
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Go build, vet & tests (core, games, cmd)
        run: |
          go build ./...
          go vet ./...
          go test ./...
      # rsrc_windows_amd64.syso is generated from the companion's favicon
      # and committed so a plain `go build` gets the exe icon. Derived
      # files go stale silently, so regenerate it here and fail on a
      # difference — rsrc's output is byte-for-byte deterministic.
      - name: Companion exe icon is current
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -ico web/companion/public/favicon.ico -arch amd64 -o /tmp/rsrc.syso
          cmp /tmp/rsrc.syso cmd/companion/rsrc_windows_amd64.syso \
            || { echo "cmd/companion/rsrc_windows_amd64.syso is stale — run: go generate ./cmd/companion"; exit 1; }
      - name: companion Windows build (players run Windows; the tray code is windows-only)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui" -o /dev/null ./cmd/companion
          GOOS=windows GOARCH=amd64 go vet ./cmd/companion
      # companiond ships as extraResources inside the Electron shell for
      # every platform electron-builder.yml targets (linux/amd64,
      # windows/amd64, darwin/amd64+arm64), so a break in any of those
      # builds is a release-time surprise if it isn't caught here first.
      - name: companiond cross-compile (every platform the Electron shell packages for)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/companiond
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go vet ./cmd/companiond
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/companiond
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./cmd/companiond
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/companiond
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/companiond

  companion-desktop:
    # The Electron shell's own test spawns `go run ./cmd/companiond`
    # (test/daemon.test.js), so this job needs both Node and Go on the
    # same runner rather than living in the anvil-less monorepo job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/companion/package-lock.json
            companion-desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # companiond embeds the companion's page (web/companion/embed.go),
      # so `go run ./cmd/companiond` does not compile until that bundle
      # exists — the same web-bundles-first ordering the monorepo job
      # follows. A dev machine hides this behind a dist/ left over from an
      # earlier build; a clean runner does not.
      - name: Companion frontend build (companiond embeds it)
        working-directory: web/companion
        run: |
          npm ci
          npm run build
      - name: Electron shell build & tests
        working-directory: companion-desktop
        run: |
          npm ci
          npm run build
          npm test
      # The shell once shipped a window containing nothing but the daemon's
      # own 401 JSON, and every check we had still passed: the daemon was
      # healthy, the handshake parsed, no process leaked. They all watched
      # the processes and none of them watched the page. This one opens the
      # window and asserts the app mounted, so it needs a display.
      - name: Install xvfb (the window smoke needs a display)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Chromium sandboxes renderers with unprivileged user namespaces
      # where the kernel allows it, and falls back to a setuid helper
      # where it does not. Ubuntu 24.04 restricts unprivileged userns
      # through AppArmor, so the runner always falls back — and the
      # helper npm unpacks is owned by the installing user and is not
      # setuid, which Electron treats as fatal rather than quietly
      # running unsandboxed. Fixing the helper rather than passing
      # --no-sandbox keeps this check running against the same sandbox a
      # shipped build uses, which matters here: the preload this window
      # loads is a *sandboxed* preload, and that is exactly where it
      # broke before.
      - name: Let Electron use its sandbox helper
        run: |
          sudo chown root:root companion-desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 companion-desktop/node_modules/electron/dist/chrome-sandbox
      - name: Window smoke (the page renders, not an error body)
        working-directory: companion-desktop
        run: npm run smoke

  anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: anvil/go.sum
      - name: Go build, vet & tests
        working-directory: anvil
        run: |
          go build ./...
          go vet ./...
          go test ./...
