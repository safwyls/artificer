name: Release (Reliquary Companion)

# Publishes the in-development Electron shell (companion-desktop/) as a
# rolling prerelease, separate from the shipping browser-and-tray
# companion's `companion-latest` release (release-companion.yml). Per
# docs/reliquary-companion.md this app is gated on a real-machine parity
# smoke before it cuts over — this workflow exists so CI, not a dev
# machine, produces the per-platform companiond binary electron-builder
# packages (companion-cutover.md Phase 5 item 3), not to announce the
# cutover itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            daemon_name: companiond
            builder_flag: --linux AppImage
          - os: windows-latest
            goos: windows
            goarch: amd64
            daemon_name: companiond.exe
            builder_flag: --win nsis
          # Apple Silicon only. The daemon in extraResources is a native
          # binary, so a dmg has to be packaged on a runner whose
          # companiond matches its arch — and the Intel runner (macos-13)
          # is being retired: its jobs sit queued indefinitely rather than
          # failing, which stalls the whole release. electron-builder.yml
          # targets arm64 alone to match.
          - os: macos-latest
            goos: darwin
            goarch: arm64
            daemon_name: companiond
            builder_flag: --mac dmg --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/companion/package-lock.json
      # The shell loads the daemon's embedded page (same contract as
      # cmd/companion), so the renderer has to be built before companiond.
      - name: Companion frontend build
        working-directory: web/companion
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # Cross-compiled per target OS/arch here rather than on a dev
      # machine, straight into the staging dir electron-builder.yml's
      # extraResources picks up (companion-cutover.md Phase 5 item 3).
      - name: Build companiond for this platform
        shell: bash
        run: |
          mkdir -p companion-desktop/resources
          # Stamped with the same SHA the release's version manifest
          # carries, the way deploy/reliquary/Dockerfile stamps the other
          # companion. The updater compares its own stamp against that
          # manifest to answer "am I running this build?" — a plain
          # `go build` leaves it "dev", which never matches and so reads
          # as permanently out of date.
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-X main.version=${GITHUB_SHA::12}" \
              -o companion-desktop/resources/${{ matrix.daemon_name }} ./cmd/companiond
      # `main` is dist/main.js, which tsc produces — electron-builder
      # does not compile anything itself, it only packages what is on
      # disk, and an uncompiled tree fails late with "application entry
      # file does not exist" rather than at the missing build step.
      - name: Electron shell dependencies & build
        working-directory: companion-desktop
        run: |
          npm ci
          npm run build
      - name: Package with electron-builder
        working-directory: companion-desktop
        # There are no signing certificates in this repo, so tell
        # electron-builder not to go looking for one: on the Mac runners
        # its identity hunt is what turns "unsigned build" into a failed
        # job. These are unsigned prereleases and the release notes say so.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # The version is synthesized here rather than kept in
        # package.json, which stays 0.1.0 and never moves.
        #
        # electron-updater compares versions, not identities: it reads
        # latest.yml's version against app.getVersion() and offers an
        # update when the former is greater. A static 0.1.0 would compare
        # equal on every release and no update would ever be seen. The
        # run number is monotonic and needs nobody to remember to bump it.
        #
        # The commit SHA is still the honest identity of a build, and is
        # still published in reliquary-companion-version.txt — that is
        # what Diagnostics shows and what a bug report needs. This number
        # exists so an updater can order two builds; it is not a claim
        # that anything here is semantically versioned.
        run: |
          npx electron-builder ${{ matrix.builder_flag }} --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}
      - name: Collect artifacts
        shell: bash
        working-directory: companion-desktop/release
        run: |
          mkdir -p ../../dist-out
          # latest*.yml is what electron-updater actually reads — the
          # installers are useless to it without them. The .blockmap
          # beside a Windows installer is what makes an update a small
          # download rather than the whole ~90MB again.
          find . -maxdepth 1 -type f \( \
              -iname '*.AppImage' -o -iname '*.exe' -o -iname '*.dmg' \
              -o -iname '*.blockmap' -o -iname 'latest*.yml' \) \
            -exec cp {} ../../dist-out/ \;
          ls -la ../../dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: reliquary-companion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out
      # Same rationale as release-companion.yml's manifests: a fact the
      # updater can read (identity + integrity), not prose to parse. The
      # shell's updater reads both — the version manifest answers "am I
      # running this build?" and the checksum manifest is what a
      # downloaded installer is verified against before it is run.
      - name: Version and checksum manifests
        run: |
          printf '%s' "${GITHUB_SHA::12}" > out/reliquary-companion-version.txt
          ( cd out && sha256sum * > reliquary-companion-sha256.txt )
          cat out/reliquary-companion-version.txt out/reliquary-companion-sha256.txt
      - name: Rolling reliquary-companion-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reliquary-companion-latest
          name: Reliquary Companion (latest, in development)
          body: |
            **This is the in-development Electron shell, not the shipping companion.**
            The Artificer Companion (`companion-latest`) remains the supported
            player-side client until this shell passes the real-machine parity
            checklist in `docs/reliquary-companion.md` and cuts over. Nothing
            here is gated behind that checklist being complete — treat these
            builds as pre-release and untested on real hardware beyond the
            Linux CI runner.

            Rebuilt from every push to main; the commit this build came from
            is ${{ github.sha }}.
          prerelease: true
          files: |
            out/*
