name: Release (Reliquary Companion)

# Publishes the Electron shell (companion-desktop/) as a versioned
# release: a bare `v*` semver tag, which is what electron-updater's
# GitHub provider resolves through /releases/latest. That tag shape is
# this app's namespace in the repository — see docs/reliquary-companion.md.
#
# Separate from the browser-and-tray companion's `companion-latest`
# (release-companion.yml), which is a rolling *prerelease* and therefore
# invisible to /releases/latest. Per docs/reliquary-companion.md this app
# is still gated on a real-machine parity smoke before it cuts over; this
# workflow exists so CI, not a dev machine, produces the per-platform
# companiond binary electron-builder packages (companion-cutover.md
# Phase 5 item 3), not to announce the cutover itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What version is this, and is it one that has not been published?
  #
  # companion-desktop/package.json is the source of truth: a release
  # happens because someone bumped it, not because someone pushed. Pushes
  # without a bump still build and test — they just do not publish, so the
  # update banner means "there is something new" rather than "someone
  # merged something".
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are how "already published" and "going backwards" are
          # both answered, and a shallow clone has none of them.
          fetch-depth: 0
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./companion-desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package.json says $version"

          # Already published: nothing to do. This is the ordinary case
          # for a push that did not touch the version.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; building without publishing"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Versions only ever go up. An installed app updates by
          # comparing versions, so a release numbered below one already
          # out there is invisible to everyone who has that one — and
          # unpublishing is not a thing. Refuse rather than discover it
          # from a bug report.
          highest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -n1)
          if [ -n "$highest" ] && [ "$version" != "$(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -n1)" ]; then
            echo "::error::package.json is $version but v$highest is already published — versions only go up"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            daemon_name: companiond
            builder_flag: --linux AppImage
          - os: windows-latest
            goos: windows
            goarch: amd64
            daemon_name: companiond.exe
            builder_flag: --win nsis
          # Apple Silicon only. The daemon in extraResources is a native
          # binary, so a dmg has to be packaged on a runner whose
          # companiond matches its arch — and the Intel runner (macos-13)
          # is being retired: its jobs sit queued indefinitely rather than
          # failing, which stalls the whole release. electron-builder.yml
          # targets arm64 alone to match.
          - os: macos-latest
            goos: darwin
            goarch: arm64
            daemon_name: companiond
            builder_flag: --mac dmg --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/companion/package-lock.json
      # The shell loads the daemon's embedded page (same contract as
      # cmd/companion), so the renderer has to be built before companiond.
      - name: Companion frontend build
        working-directory: web/companion
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # Cross-compiled per target OS/arch here rather than on a dev
      # machine, straight into the staging dir electron-builder.yml's
      # extraResources picks up (companion-cutover.md Phase 5 item 3).
      - name: Build companiond for this platform
        shell: bash
        run: |
          mkdir -p companion-desktop/resources
          # The daemon carries the *application's* version, so the two
          # halves of one app do not report different things. Diagnostics
          # shows this; a plain `go build` would leave it "dev".
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-X main.version=${{ needs.version.outputs.version }}" \
              -o companion-desktop/resources/${{ matrix.daemon_name }} ./cmd/companiond
      # `main` is dist/main.js, which tsc produces — electron-builder
      # does not compile anything itself, it only packages what is on
      # disk, and an uncompiled tree fails late with "application entry
      # file does not exist" rather than at the missing build step.
      - name: Electron shell dependencies & build
        working-directory: companion-desktop
        run: |
          npm ci
          npm run build
      - name: Package with electron-builder
        working-directory: companion-desktop
        # There are no signing certificates in this repo, so tell
        # electron-builder not to go looking for one: on the Mac runners
        # its identity hunt is what turns "unsigned build" into a failed
        # job. These are unsigned prereleases and the release notes say so.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # No version override: companion-desktop/package.json carries it,
        # and the version job has already established that it is one that
        # has not been published and is not going backwards.
        run: npx electron-builder ${{ matrix.builder_flag }} --publish never
      - name: Collect artifacts
        shell: bash
        working-directory: companion-desktop/release
        run: |
          mkdir -p ../../dist-out
          # latest*.yml is what electron-updater actually reads — the
          # installers are useless to it without them. The .blockmap
          # beside a Windows installer is what makes an update a small
          # download rather than the whole ~90MB again.
          find . -maxdepth 1 -type f \( \
              -iname '*.AppImage' -o -iname '*.exe' -o -iname '*.dmg' \
              -o -iname '*.blockmap' -o -iname 'latest*.yml' \) \
            -exec cp {} ../../dist-out/ \;
          ls -la ../../dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: reliquary-companion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    # Only when the version is one that has not been published. A push
    # that did not bump it still built and tested above; it just has
    # nothing to release.
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out
      # Build provenance, not update machinery: the updater reads
      # latest.yml and the sha512 in it, and neither of these. They
      # answer "which commit is this build" and "did my download arrive
      # intact", both of which a bug report and a careful player want.
      - name: Version and checksum manifests
        run: |
          printf '%s' "${GITHUB_SHA::12}" > out/reliquary-companion-version.txt
          ( cd out && sha256sum * > reliquary-companion-sha256.txt )
          cat out/reliquary-companion-version.txt out/reliquary-companion-sha256.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # A bare semver tag, because that is the only shape
          # electron-updater's GitHub provider will look at: it runs
          # every tag through semver.valid() and skips what does not
          # parse. `v*` is therefore this app's tag namespace in this
          # repository, and nothing else here may publish one.
          tag_name: v${{ needs.version.outputs.version }}
          name: Reliquary Companion v${{ needs.version.outputs.version }}
          body: |
            The Reliquary Companion — the player-side client for save sync.

            **Windows and Linux update themselves** from this release track:
            the app checks it, downloads only what changed, and installs.
            **macOS does not** — these builds are unsigned, and macOS
            verifies a signature before replacing an app, so the .dmg is
            installed by hand.

            Nothing here is signed, so Windows SmartScreen will warn on
            first run. `reliquary-companion-sha256.txt` is published beside
            the installers for anyone verifying a download, and
            `reliquary-companion-version.txt` names the commit this build
            came from: ${{ github.sha }}.
          # Not a prerelease: this is what electron-updater resolves
          # through /releases/latest, which excludes them. Marking it one
          # would make the app unable to find its own updates.
          prerelease: false
          files: |
            out/*
