name: Docker (reliquary)

# Publishes the standalone save-sync service. New image, no legacy names
# to preserve; :latest tracks main like the other services since the
# suite is the gate (no real-server ceremony applies to a service that
# talks to no game).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stamp both UIs show. A tag names itself; main names the
      # commit, short enough to read back over a chat message.
      - id: version
        run: echo "value=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}" | cut -c1-25 >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/reliquary
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/reliquary/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=artificer-reliquary
          cache-to: type=gha,mode=min,scope=artificer-reliquary
