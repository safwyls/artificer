name: Docker (flametender)

# Publishes the monorepo-built flametender + flameagent images under the
# SAME ghcr names the old repo used — deployed apps repoint a tag,
# nothing else (unification plan, "Deploy continuity").
#
# Deliberately NOT publishing :latest yet: that flips on after the
# Phase 3 real-server gate passes. Until then the branch tag (:main) is
# the verification channel.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: flametender
            dockerfile: deploy/flametender/Dockerfile
          - image: flameagent
            dockerfile: deploy/flametender/Dockerfile.flameagent
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # Enabled since the Phase 3 gate passed (2026-08-16, live
            # Enshrouded server) — the old repo's channel is replaced.
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=artificer-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=artificer-${{ matrix.image }}
