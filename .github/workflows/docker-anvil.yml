name: Docker (anvil)

# Publishes the host provisioning service. Anvil is a separate Go module
# with its own Dockerfile, so the build context is anvil/ rather than the
# repo root — nothing above it is copied in, matching the dependency rule.
#
# Two names are published from one build. `anvil` is the name going
# forward; `ilmari` is a migration channel for deployments that were
# pinned to the old name before the rename, so they keep receiving
# updates instead of silently freezing at the last build from the old
# repo. Drop the ilmari half once the running hosts are repointed.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "anvil/**"
      - ".github/workflows/docker-anvil.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anvil
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ilmari
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: anvil
          file: anvil/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=artificer-anvil
          cache-to: type=gha,mode=min,scope=artificer-anvil
