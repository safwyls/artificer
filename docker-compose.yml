services:
  flamekeeper:
    build: .
    # For TrueNAS/production, swap the line above for the published image
    # instead of building locally:
    # image: ghcr.io/safwyls/flamekeeper:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Only needed for servers WITHOUT a flameagent sidecar — with an agent,
      # Flamekeeper pulls saves and config over its API and neither mount
      # below is used.
      #
      # World saves: bind-mount the server's SaveGames directory READ-ONLY,
      # then set that container path as the server's "Save path", e.g.:
      # - /path/to/RSDragonwilds/Saved/SaveGames:/saves/myserver:ro
      #
      # Settings editor: separately bind-mount the folder holding
      # DedicatedServer.ini READ-WRITE (no :ro), then set that container path
      # as the server's "Config path". Keeping this a distinct mount from the
      # save directory above is deliberate — the settings editor can write
      # here, while the save data stays read-only and untouchable, e.g.:
      # - /path/to/RSDragonwilds/Saved/Config/LinuxServer:/config/myserver
    environment:
      - HTTP_ADDR=:8080
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Optional: enables the start/stop/restart controls. Points at the
      # scoped proxy below, never at the host's docker socket directly —
      # that socket is root-equivalent, and Flamekeeper has no business
      # holding it. Leave unset to run without power control. Servers run
      # by a flameagent sidecar don't need this at all: power goes through
      # the agent.
      - DOCKER_HOST=tcp://docker-proxy:2375
    restart: unless-stopped

  # Grants exactly two things: reading container state, and POSTing
  # start/stop/restart. It cannot create containers, mount volumes, or read
  # images, so a compromise of Flamekeeper can at worst bounce a game server.
  # Only this container touches the docker socket.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1   # inspect container state
      - POST=1         # allow start/stop/restart (read-only without this)
      # Stopping asks the game to exit cleanly first, so the container
      # records exit code 0 rather than being SIGKILLed as "crashed".
      # Everything else stays off. Notably IMAGES, VOLUMES, NETWORKS, EXEC
      # and the swarm APIs, any of which would widen this well past
      # "bounce a game server".
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
