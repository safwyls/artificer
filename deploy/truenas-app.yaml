# Flamekeeper on TrueNAS SCALE (24.10+ / Electric Eel and later)
#
# Install as: Apps → Discover → ⋮ → Install via YAML, name it "flamekeeper",
# and paste this file. TrueNAS custom apps are plain Docker Compose, so
# everything in docker-compose.yml applies — this variant just bakes in the
# TrueNAS conventions (host-path dataset, the shared external network, the
# published image instead of a local build).
#
# Before installing:
#
# 1. Make a dataset for the app's state, e.g. /mnt/tank/apps/flamekeeper,
#    and chown it to whatever user the container runs as. The user: line
#    below defaults to TrueNAS's conventional apps user (568:568):
#        chown -R 568:568 /mnt/tank/apps/flamekeeper
#    Any other uid:gid works too — the binary only needs a writable /data —
#    just keep user: and the chown in agreement. (The image's baked-in
#    default is 1000:1000 if you remove the user: line.)
#    Then set the dataset path in the volumes: section below.
#
# 2. Create the shared network the game-server stacks join
#    (docs/sidecar-agent.md "Deployment rule: separate stacks" — the
#    console and each game server are separate apps so tearing one down
#    can never take the other with it):
#        docker network create flamekeeper-net
#
# 3. Fill in the x-secrets values below. The lengths are enforced at
#    startup — wrong lengths make the container exit immediately with a
#    fatal log line. Generate them with:
#        openssl rand -hex 32        # JWT_SECRET      (64 chars; needs ≥32)
#        openssl rand -hex 16        # ENCRYPTION_KEY  (32 chars; needs exactly 32)
#    ENCRYPTION_KEY protects the agent/RCON credentials at rest in the DB —
#    losing it means re-entering every server's tokens.

x-secrets: &secrets
  JWT_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  ENCRYPTION_KEY: "CHANGE-ME-must-be-exactly-32b"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE-ME"

services:
  flamekeeper:
    image: ghcr.io/safwyls/flamekeeper:latest
    # TrueNAS's compose backend defaults to pull_policy "missing": once the
    # tag exists locally, redeploys silently reuse the stale image. "always"
    # re-resolves :latest against ghcr on every app update/redeploy.
    pull_policy: always
    # Runs as the TrueNAS apps user; must match the dataset chown (step 1).
    user: "568:568"
    restart: unless-stopped
    ports:
      - "8080:8080"        # web UI + API; put TrueNAS's nginx or Traefik in front if you want TLS
    volumes:
      - /mnt/tank/apps/flamekeeper:/data   # ← your dataset (owned by uid 1000)
    environment:
      <<: *secrets
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      # Power control (start/stop/restart buttons) for game servers that
      # run as containers on this box WITHOUT a flameagent sidecar. Servers
      # fronted by a flameagent don't need this — power goes through the
      # agent — so if every server has an agent you can drop this line
      # and the docker-proxy service entirely.
      DOCKER_HOST: tcp://docker-proxy:2375
      # One-click provisioning from the "Raise a server" wizard, through
      # the shared Ilmari host service (github.com/safwyls/ilmari) already
      # running on this box for wildskeeper and palcon. Flamekeeper ships
      # no provisioner of its own — one host, one Docker-socket holder.
      #
      # Register flamekeeper as an Ilmari client first (its clients file;
      # see "Registering with Ilmari" below), then uncomment. The token is
      # flamekeeper's OWN client token, not wildskeeper's and not palcon's.
      # Leave commented to use the copy-paste flow instead.
      # ILMARI_URL: http://192.168.1.CHANGE-ME:8820
      # ILMARI_TOKEN: "CHANGE-ME-flamekeeper-ilmari-token"
    networks:
      - default
      - flamekeeper-net

  # Scoped docker socket proxy: Flamekeeper never touches the socket
  # directly (root-equivalent). This grants exactly container inspect +
  # start/stop/restart — a compromised console can at worst bounce a game
  # server. Remove if every game server is agent-managed (see above).
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # inspect container state
      POST: "1"         # allow start/stop/restart
      # Everything else (IMAGES, VOLUMES, NETWORKS, EXEC, swarm) stays off.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  flamekeeper-net:
    external: true

# Registering with Ilmari
#
# Ilmari's design promise is that a new console needs no code there — only
# a client registration. On the Ilmari app, add to its clients file (the
# ILMARI_CLIENTS_FILE JSON array):
#
#   {"id": "flamekeeper",
#    "token": "<openssl rand -hex 24 — the ILMARI_TOKEN above>",
#    "dataRoot": "/mnt/tank/apps/enshrouded-servers",
#    "envPrefix": "FLAMEAGENT_",
#    "imagePrefixes": ["ghcr.io/safwyls/flameagent"]}
#
# then create + chown the data root (chown -R 1000:1000, or whatever
# run-as the wizard will use) and redeploy Ilmari. Provisioned servers
# land under that data root, one directory per server slug, each mounted
# at /enshrouded in its flameagent container.
#
# Ports: Enshrouded uses ONE UDP port per server (default 15637 — game
# traffic and Steam query together) plus the agent's TCP port (8811+).
# The wizard proposes free ones; when wildskeeper or palcon share the
# box, eyeball `docker ps` for collisions anyway — port proposals can't
# see rows in the *other* consoles' databases, only live containers.
